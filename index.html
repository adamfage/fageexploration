<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fage Exploration Ltd.</title>
<meta name="description" content="Independent consulting geoscience supporting mineral exploration projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground:  #F4F5F2;
    --ink:     #1A2227;
    --muted:   #5F6E72;
    --faint:   #8B979A;
    --line:    #D8DCD6;
    --accent:  #8C4A2F;
    --cool:    #2E5F6B;

    --serif: 'Spectral', Georgia, 'Times New Roman', serif;
    --mono:  'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground:  #12181B;
      --ink:     #E7EBE8;
      --muted:   #9AA8AB;
      --faint:   #6E7C80;
      --line:    #2A3539;
      --accent:  #C47A55;
      --cool:    #6CA3B0;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-inline: 24px;
    padding-block: 56px;
  }

  main {
    width: 100%;
    max-width: 540px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }

  h1 {
    font-weight: 600;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 20px;
    text-wrap: balance;
  }

  .tagline {
    font-size: clamp(16px, 3vw, 18.5px);
    line-height: 1.5;
    color: var(--muted);
    margin: 0 auto 40px;
    max-width: 38ch;
    text-wrap: balance;
  }

  figure {
    margin: 0 0 40px;
  }
  figure svg { display: block; width: 100%; height: auto; }

  .rule {
    width: 44px;
    height: 1px;
    background: var(--line);
    border: 0;
    margin: 0 auto 28px;
  }

  .contact-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 10px;
  }

  a.mail {
    font-family: var(--mono);
    font-size: clamp(14px, 3.4vw, 16px);
    color: var(--ink);
    text-decoration: none;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 2px;
    word-break: break-all;
  }
  a.mail:hover { color: var(--accent); }
  a.mail:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  footer {
    margin-top: 56px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
</style>
</head>
<body>

<main>
  <p class="eyebrow">Consulting Geoscience</p>
  <h1>Fage Exploration Ltd.</h1>
  <p class="tagline">Independent geoscience supporting mineral exploration projects toward discovery.</p>

  <figure>
    <svg viewBox="0 0 520 150" role="img" aria-label="Stylised magnetic contour map showing a northeast-trending anomaly.">
      <g stroke="var(--line)" stroke-width="1" fill="none" opacity="0.85">
        <path d="M70 18 L70 132 M120 18 L120 132 M170 18 L170 132 M220 18 L220 132
                 M270 18 L270 132 M320 18 L320 132 M370 18 L370 132 M420 18 L420 132
                 M450 18 L450 132"/>
      </g>
      <g fill="none" stroke-width="1.2" transform="rotate(-32 248 75)">
        <ellipse cx="248" cy="75" rx="168" ry="60" stroke="var(--cool)" opacity="0.28"/>
        <ellipse cx="248" cy="75" rx="133" ry="46" stroke="var(--cool)" opacity="0.42"/>
        <ellipse cx="248" cy="75" rx="99"  ry="34" stroke="var(--cool)" opacity="0.56"/>
        <ellipse cx="248" cy="75" rx="67"  ry="23" stroke="var(--accent)" opacity="0.68"/>
        <ellipse cx="248" cy="75" rx="37"  ry="13" stroke="var(--accent)" opacity="0.84"/>
        <ellipse cx="248" cy="75" rx="14"  ry="5"  stroke="var(--accent)" stroke-width="1.5"/>
      </g>
      <circle cx="248" cy="75" r="2.4" fill="var(--accent)"/>
    </svg>
  </figure>

  <hr class="rule">

  <p class="contact-label">Enquiries</p>
  <a class="mail" href="mailto:adam@fageexploration.com">adam@fageexploration.com</a>

  <footer>British Columbia, Canada</footer>
</main>

</body>
</html>
